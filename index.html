<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080b12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>CORE / BREAK</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <div class="game-wrapper">
      
      <!-- Top Control Bar (Audio, Stage Select, Restart) -->
      <div class="top-controls">
        <select id="stageSelect" class="ctrl-btn">
          <option value="1">STAGE 1: PROTO CORE (初生核心)</option>
          <option value="2">STAGE 2: CROSS BARRIER (十字壁障)</option>
          <option value="3">STAGE 3: TWIN ORBS (双子星核)</option>
          <option value="4">STAGE 4: QUANTUM PRISM (量子棱镜)</option>
          <option value="5">STAGE 5: HOURGLASS (沙漏迷宫)</option>
          <option value="6">STAGE 6: DUAL CORE (双重复核)</option>
          <option value="7">STAGE 7: CYCLONE VORTEX (气旋漩涡)</option>
          <option value="8">STAGE 8: CYBER SHIELD (赛博盾阵)</option>
          <option value="9">STAGE 9: DNA HELIX (双螺旋链)</option>
          <option value="10">STAGE 10: BLACK HOLE (黑洞日蚀)</option>
          <option value="11">STAGE 11: TRIPLE APEX (三尖裂隙)</option>
          <option value="12" selected>STAGE 12: OMEGA CORE (3,379 欧米伽穹顶)</option>
          <option value="13">STAGE 13: NEON LABYRINTH (霓虹迷宫)</option>
          <option value="14">STAGE 14: CHAOS MATRIX (混沌矩阵)</option>
          <option value="15">STAGE 15: HYPERNOVA (终焉对撞机)</option>
        </select>
        <div>
          <button id="muteBtn" class="ctrl-btn">🔊 SOUND</button>
          <button id="restartBtn" class="ctrl-btn">↺ RESET</button>
        </div>
      </div>

      <!-- Top In-Game HUD (Exact Screenshot Replica) -->
      <header class="hud-header">
        <div class="hud-item hud-left">
          <span class="hud-label">CLEARED</span>
          <span class="hud-value"><span id="clearedCount">0000</span> / <span id="totalCount">3379</span></span>
        </div>

        <div class="hud-item hud-center">
          <span id="stageTitle" class="hud-title">CORE / BREAK  -  STAGE 12</span>
        </div>

        <div class="hud-item hud-right">
          <span class="hud-label">BALLS</span>
          <span id="hudBalls" class="hud-value"><span id="ballsCount">001</span></span>
        </div>
      </header>

      <!-- Floating Combo Notification -->
      <div id="comboDisplay" class="combo-banner">HYPER COMBO!</div>

      <!-- Canvas Area -->
      <main id="gameContainer">
        <canvas id="gameCanvas"></canvas>
      </main>

      <!-- Bottom Hint Bar -->
      <footer class="bottom-bar">
        <span class="bottom-hint">DRAG TO MOVE • TAP / SPACE TO LAUNCH</span>
      </footer>

    </div>
  </div>

  <script src="sounds.js"></script>
  <script src="game.js"></script>
</body>
</html>
